name: Setup NPM Packages
description: Setup required NPM packages with caching for pnpm
runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/pnpm-packages@4a6a7482207c0ba30b3b6487cccef3491bde6e7c
    with:
      frozen: 'true'
      ignore-scripts: 'true'
      paths: |
        .
        website
