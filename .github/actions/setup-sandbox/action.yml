name: Install Docker Compose and Run Custom Script
description: Installs Docker Compose v2 and runs a custom bash script

inputs:
  script:
    description: The bash script to execute
    required: true
    default: ''
  wait-timeout-ms:
    description: Timeout in milliseconds for wait-on
    required: false
    default: '240000'

runs:
  using: composite
  steps:
    - name: Run Docker Compose and Custom Script
      shell: bash
      run: |
        set -euo pipefail

        SANDBOX_STARTED=0

        # Teardown is the single chokepoint for log capture and service
        # shutdown. EXIT fires on normal completion, on failures under `set -e`,
        # and on INT/TERM (job cancellation), so the trap covers every
        # terminal condition without a separate ERR handler. The trap also
        # runs `exit "$EXIT_CODE"` to preserve the original exit status while
        # still doing diagnostics; the EXIT trap is non-re-entrant in bash, so
        # the inner `exit` does not recurse the handler.
        teardown() {
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "==== $(date) Diagnostics (exit=$EXIT_CODE): sandbox logs ===="
            make DAEMON=true logs || true
          fi
          if [ "$SANDBOX_STARTED" -eq 1 ]; then
            echo "==== $(date) Stopping services (teardown) ===="
            make down || true
          fi
          exit "$EXIT_CODE"
        }
        trap teardown EXIT

        echo "Starting services..."
        make DAEMON=true up
        SANDBOX_STARTED=1

        echo "Waiting for services to be ready..."
        (
          node_modules/.bin/wait-on \
            http-get://localhost:8080/realms/master/.well-known/openid-configuration \
            --timeout "${{ inputs.wait-timeout-ms }}"
        ) &
        WAIT_PID=$!

        # Periodically check logs until wait-on finishes
        while kill -0 "$WAIT_PID" 2>/dev/null; do
          echo "==== $(date) Checking logs ===="
          make DAEMON=true logs
          sleep 5
        done

        wait "$WAIT_PID"  # ensure wait-on exit status is captured
        echo "wait-on complete!"

        echo "Running provided script..."
        bash -c "${{ inputs.script }}"

        echo "Stopping services..."
        make down
        SANDBOX_STARTED=0
