name: 12.Test codebase

on:
  push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM Packages
      uses: ./.github/actions/setup-npm

    - name: Lint (non-mutating)
      run: pnpm lint:check

    - name: Typecheck (src)
      run: pnpm typecheck

    - name: Typecheck (tests)
      run: pnpm typecheck:tests

  artifact-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM Packages
      uses: ./.github/actions/setup-npm

    - name: Build publishable dist/
      run: pnpm build

    - name: Inspect packed tarball
      run: pnpm pack:inspect

    - name: Install + exercise packed tarball in isolated consumers (ESM, CJS, TypeScript)
      run: pnpm pack:consumers

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM Packages
      uses: ./.github/actions/setup-npm

    - name: Run unit tests in sandbox
      uses: ./.github/actions/setup-sandbox
      with:
        script: |
          pnpm test:unit
          pnpm test:integration
